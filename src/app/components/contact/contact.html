<section class="contact-section" id="contact">
  <div class="section-label">Contact</div>
  <h2>Travaillons ensemble</h2>
  <p>
    Je cherche une première expérience professionnelle stimulante.
    Si vous avez un projet, un stage ou un poste junior, je serais ravie d'échanger.
  </p>
  <div class="contact-actions">
    <button class="btn-white" (click)="openModal()">Envoyer un email →</button>
    <a href="https://www.linkedin.com/in/wiem-ben-romdhane-engineer" class="btn-outline-white" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
    <a href="https://github.com/wiemet" class="btn-outline-white" target="_blank">GitHub ↗</a>
  </div>
</section>

<!-- Overlay modale -->
<div class="modal-overlay" [class.active]="isModalOpen" (click)="closeModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="closeModal()">×</button>

    <ng-container *ngIf="!isSuccess">
      <h3>Envoyer un message</h3>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="form.name" placeholder="Votre nom" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" placeholder="votre@email.com" required />
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea [(ngModel)]="form.message" placeholder="Votre message..." required></textarea>
      </div>
      <button type="button" class="modal-submit" (click)="onSubmit()" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Envoi...' : 'Envoyer →' }}
      </button>
    </ng-container>

    <div *ngIf="isSuccess" class="success-msg">
      Message envoyé ! Je vous répondrai bientôt.
    </div>
  </div>
</div>
